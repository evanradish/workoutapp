# Builds the Google TV app (an APK) whenever the code changes, and publishes it
# as the "latest" release so the TV can download it from a short link.
name: Build Google TV app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../workouts-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: workouts-tv
          path: workouts-tv.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Workouts for Google TV
          files: workouts-tv.apk
          make_latest: true
